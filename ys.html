<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学元素消消乐</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'ZCOOL QingKe HuangYou', cursive, sans-serif;
            background-color: #ffe6f2; /* 浅粉色背景 */
            color: #333;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(#ffb6d9 2px, transparent 2px),
                radial-gradient(#ffccdd 1px, transparent 1px);
            background-size: 40px 40px, 20px 20px;
            background-position: 0 0, 20px 20px;
            position: relative;
        }

        /* 可爱点缀 */
        .decoration {
            position: absolute;
            z-index: 0;
            opacity: 0.7;
            font-size: 1.8rem;
        }

        /* 容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 150, 200, 0.2);
            border: 2px dashed #ff99cc;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #ff66b2, #ff99cc, #ffb6d9, #ff99cc, #ff66b2);
        }

        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3.5rem;
            color: #ff3399;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 #ffccdd;
            letter-spacing: 3px;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #666;
            margin-bottom: 15px;
        }

        /* 游戏信息区域 */
        .game-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(255, 150, 200, 0.2);
        }

        .timer, .score {
            font-size: 2.2rem;
            color: #ff3399;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .timer i, .score i {
            margin-right: 10px;
            color: #ff66b2;
        }

        /* 游戏区域 - 左右布局 */
        .game-area {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* 左侧：元素名称区域 */
        .element-section.left-section {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(150, 200, 255, 0.25);
            position: relative;
            overflow: hidden;
            min-height: 600px;
            border: 3px solid #80c1ff;
        }

        /* 右侧：元素符号区域 */
        .element-section.right-section {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(255, 150, 200, 0.25);
            position: relative;
            overflow: hidden;
            min-height: 600px;
            border: 3px solid #ff99bb;
        }

        .element-section h2 {
            text-align: center;
            font-size: 2.2rem;
            color: #ff3399;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 3px dotted #ff99cc;
        }

        /* 左侧标题特殊样式 */
        .left-section h2 {
            color: #0066cc;
            border-bottom: 3px dotted #80c1ff;
        }

        /* 右侧标题特殊样式 */
        .right-section h2 {
            color: #cc0066;
            border-bottom: 3px dotted #ff99bb;
        }

        /* 泡泡容器 */
        .bubbles-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        /* 泡泡样式 */
        .bubble {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 
                inset 0 -8px 10px rgba(0,0,0,0.1),
                inset 0 8px 10px rgba(255,255,255,0.7),
                0 5px 15px rgba(0,0,0,0.1);
            z-index: 2;
            overflow: hidden;
        }

        .bubble:hover {
            transform: scale(1.1);
            box-shadow: 
                inset 0 -8px 10px rgba(0,0,0,0.1),
                inset 0 8px 10px rgba(255,255,255,0.9),
                0 8px 20px rgba(0,0,0,0.15);
        }

        /* 左侧泡泡 - 元素名称 */
        .element-name {
            background: linear-gradient(145deg, #a6d8ff, #c2e6ff);
            color: #0066cc;
            border: 3px solid #80c1ff;
        }

        /* 右侧泡泡 - 元素符号 */
        .element-symbol {
            background: linear-gradient(145deg, #ffccd9, #ffebf0);
            color: #cc0066;
            border: 3px solid #ff99bb;
        }

        /* 被选中的泡泡 */
        .bubble.selected {
            transform: scale(1.15);
            box-shadow: 
                inset 0 -8px 10px rgba(0,0,0,0.15),
                inset 0 8px 10px rgba(255,255,255,1),
                0 0 25px rgba(255, 102, 178, 0.7);
            border-width: 4px;
        }

        /* 已匹配的泡泡 */
        .matched {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* 匹配线 */
        .match-line {
            position: absolute;
            height: 4px;
            background: linear-gradient(to right, #ff3399, #ff66b2);
            z-index: 1;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 51, 153, 0.7);
        }

        /* 激励语 */
        .encouragement {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            font-size: 2.5rem;
            color: #ff3399;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.4);
            z-index: 100;
            border: 4px solid #ff99cc;
            text-align: center;
            max-width: 80%;
            transition: transform 0.5s ease;
        }

        .encouragement.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 游戏结束提示 */
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-over.show {
            opacity: 1;
            pointer-events: all;
        }

        .game-over-content {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(255, 102, 178, 0.5);
            border: 5px solid #ff99cc;
        }

        .game-over-content h2 {
            font-size: 3rem;
            color: #ff3399;
            margin-bottom: 20px;
        }

        .game-over-content p {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #666;
        }

        .restart-btn {
            background: linear-gradient(to right, #ff66b2, #ff99cc);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.8rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Ma Shan Zheng', cursive;
            letter-spacing: 2px;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 102, 178, 0.4);
        }

        /* 底部说明 */
        .instructions {
            text-align: center;
            font-size: 1.5rem;
            color: #666;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 15px;
            margin-top: 20px;
        }

        .instructions i {
            color: #ff66b2;
            margin: 0 10px;
        }

        /* 连接指示器 */
        .connection-hint {
            text-align: center;
            font-size: 1.8rem;
            color: #ff3399;
            margin: 10px 0;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .connection-hint i {
            margin: 0 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 响应式设计 */
        @media (max-width: 1100px) {
            .game-area {
                flex-direction: column;
            }
            
            h1 {
                font-size: 2.8rem;
            }
            
            .subtitle {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .bubble {
                width: 70px;
                height: 70px;
                font-size: 1.5rem;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .timer, .score {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- 可爱点缀元素 -->
    <div class="decoration" style="top: 10%; left: 5%;">⚗️</div>
    <div class="decoration" style="top: 15%; right: 8%;">🧪</div>
    <div class="decoration" style="bottom: 20%; left: 3%;">🔬</div>
    <div class="decoration" style="bottom: 10%; right: 5%;">🌡️</div>
    <div class="decoration" style="top: 30%; left: 2%;">💫</div>
    <div class="decoration" style="top: 40%; right: 2%;">✨</div>

    <div class="container">
        <!-- 标题区域 -->
        <div class="header">
            <h1>化学元素消消乐</h1>
            <div class="subtitle">熟悉常用的元素符号及其名称</div>
        </div>

        <!-- 游戏信息 -->
        <div class="game-info">
            <div class="timer">
                <i class="fas fa-clock"></i>
                <span id="time">01:00</span>
            </div>
            <div class="score">
                <i class="fas fa-star"></i>
                得分: <span id="score">0</span>
            </div>
        </div>

        <!-- 连接提示 -->
        <div class="connection-hint">
            <div>点击左侧元素名称</div>
            <i class="fas fa-arrow-right"></i>
            <div>点击右侧对应符号</div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-area">
            <!-- 左侧：元素名称区域 -->
            <div class="element-section left-section">
                <h2>元素名称</h2>
                <div class="bubbles-container" id="names-container">
                    <!-- 元素名称泡泡将在这里动态生成 -->
                </div>
            </div>

            <!-- 右侧：元素符号区域 -->
            <div class="element-section right-section">
                <h2>元素符号</h2>
                <div class="bubbles-container" id="symbols-container">
                    <!-- 元素符号泡泡将在这里动态生成 -->
                </div>
            </div>
        </div>

        <!-- 游戏说明 -->
        <div class="instructions">
            <i class="fas fa-mouse-pointer"></i>
            点击左侧元素名称，然后点击右侧对应的元素符号
            <i class="fas fa-fireworks"></i>
            匹配成功会有烟花特效和加分
            <i class="fas fa-trophy"></i>
            1分钟内匹配越多得分越高
        </div>
    </div>

    <!-- 激励语显示 -->
    <div id="encouragement" class="encouragement"></div>

    <!-- 游戏结束提示 -->
    <div id="gameOver" class="game-over">
        <div class="game-over-content">
            <h2>时间到!</h2>
            <p>你的最终得分: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">
                <i class="fas fa-redo"></i> 重新开始
            </button>
        </div>
    </div>

    <!-- 音效 -->
    <audio id="matchSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3" type="audio/mpeg">
    </audio>
    <audio id="clickSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-up-3004.mp3" type="audio/mpeg">
    </audio>
    <audio id="gameOverSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-game-over-tetris-2047.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 游戏数据
        const elements = {
            names: ["氢", "氦", "锂", "铍", "硼", "碳", "氮", "氧", "氟", "氖", 
                   "钠", "镁", "铝", "硅", "磷", "硫", "氯", "氩", "钾", "钙", 
                   "铁", "铜", "锌", "钡", "银"],
            symbols: ["Na", "Mg", "Al", "B", "C", "N", "O", "F", "Ne", "Si", 
                     "P", "S", "Cl", "Ar", "K", "Ca", "H", "He", "Li", "Be", 
                     "Cu", "Fe", "Ag", "Zn", "Ba"]
        };

        // 元素名称与符号的对应关系
        const elementMap = {
            "氢": "H", "氦": "He", "锂": "Li", "铍": "Be", "硼": "B",
            "碳": "C", "氮": "N", "氧": "O", "氟": "F", "氖": "Ne",
            "钠": "Na", "镁": "Mg", "铝": "Al", "硅": "Si", "磷": "P",
            "硫": "S", "氯": "Cl", "氩": "Ar", "钾": "K", "钙": "Ca",
            "铁": "Fe", "铜": "Cu", "锌": "Zn", "钡": "Ba", "银": "Ag"
        };

        // 游戏状态
        let gameState = {
            score: 0,
            timeLeft: 60, // 1分钟
            timer: null,
            selectedName: null,
            selectedSymbol: null,
            matchedPairs: 0,
            totalPairs: 25
        };

        // 激励语句
        const encouragements = [
            "太棒了！",
            "做得好！",
            "继续加油！",
            "你真聪明！",
            "完美匹配！",
            "化学天才！",
            "太厉害了！",
            "继续前进！",
            "太对了！",
            "又快又准！"
        ];

        // 初始化游戏
        function initGame() {
            // 重置游戏状态
            gameState.score = 0;
            gameState.timeLeft = 60;
            gameState.selectedName = null;
            gameState.selectedSymbol = null;
            gameState.matchedPairs = 0;
            
            // 更新显示
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('time').textContent = formatTime(gameState.timeLeft);
            document.getElementById('gameOver').classList.remove('show');
            
            // 清空容器
            document.getElementById('names-container').innerHTML = '';
            document.getElementById('symbols-container').innerHTML = '';
            
            // 打乱数组
            const shuffledNames = [...elements.names].sort(() => Math.random() - 0.5);
            const shuffledSymbols = [...elements.symbols].sort(() => Math.random() - 0.5);
            
            // 创建左侧名称泡泡
            shuffledNames.forEach(name => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble element-name';
                bubble.textContent = name;
                bubble.dataset.name = name;
                bubble.dataset.symbol = elementMap[name];
                bubble.addEventListener('click', () => selectName(name, bubble));
                
                // 添加浮动动画
                gsap.to(bubble, {
                    y: () => Math.random() * 20 - 10,
                    duration: 2 + Math.random() * 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
                
                document.getElementById('names-container').appendChild(bubble);
            });
            
            // 创建右侧符号泡泡
            shuffledSymbols.forEach(symbol => {
                const bubble = document.createElement('div');
                bubble.className = 'bubble element-symbol';
                bubble.textContent = symbol;
                bubble.dataset.symbol = symbol;
                bubble.addEventListener('click', () => selectSymbol(symbol, bubble));
                
                // 添加浮动动画
                gsap.to(bubble, {
                    y: () => Math.random() * 20 - 10,
                    duration: 2 + Math.random() * 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
                
                document.getElementById('symbols-container').appendChild(bubble);
            });
            
            // 启动计时器
            if (gameState.timer) clearInterval(gameState.timer);
            gameState.timer = setInterval(updateTimer, 1000);
        }

        // 选择元素名称（左侧）
        function selectName(name, element) {
            if (gameState.timeLeft <= 0) return;
            
            // 播放点击音效
            document.getElementById('clickSound').currentTime = 0;
            document.getElementById('clickSound').play();
            
            // 清除之前的选择
            if (gameState.selectedName) {
                gameState.selectedName.classList.remove('selected');
            }
            
            // 清除符号选择（如果已选择）
            if (gameState.selectedSymbol) {
                gameState.selectedSymbol.classList.remove('selected');
                gameState.selectedSymbol = null;
            }
            
            // 设置新选择
            gameState.selectedName = element;
            element.classList.add('selected');
            
            // 高亮显示
            gsap.to(element, {
                scale: 1.2,
                duration: 0.3,
                yoyo: true,
                repeat: 1
            });
        }

        // 选择元素符号（右侧）
        function selectSymbol(symbol, element) {
            if (gameState.timeLeft <= 0) return;
            
            // 如果没有先选择名称，直接返回
            if (!gameState.selectedName) {
                // 提示先选择名称
                const encouragement = document.getElementById('encouragement');
                encouragement.textContent = "请先选择左侧的元素名称";
                encouragement.style.color = "#ff6666";
                encouragement.classList.add('show');
                
                setTimeout(() => {
                    encouragement.classList.remove('show');
                }, 1500);
                return;
            }
            
            // 播放点击音效
            document.getElementById('clickSound').currentTime = 0;
            document.getElementById('clickSound').play();
            
            // 清除之前的选择
            if (gameState.selectedSymbol) {
                gameState.selectedSymbol.classList.remove('selected');
            }
            
            // 设置新选择
            gameState.selectedSymbol = element;
            element.classList.add('selected');
            
            // 高亮显示
            gsap.to(element, {
                scale: 1.2,
                duration: 0.3,
                yoyo: true,
                repeat: 1
            });
            
            // 检查是否匹配
            setTimeout(() => {
                checkMatch();
            }, 300);
        }

        // 检查是否匹配
        function checkMatch() {
            const name = gameState.selectedName.dataset.name;
            const expectedSymbol = gameState.selectedName.dataset.symbol;
            const selectedSymbol = gameState.selectedSymbol.dataset.symbol;
            
            if (expectedSymbol === selectedSymbol) {
                // 匹配成功
                gameState.score += 10;
                gameState.matchedPairs++;
                
                // 更新得分显示
                document.getElementById('score').textContent = gameState.score;
                
                // 播放匹配音效
                document.getElementById('matchSound').currentTime = 0;
                document.getElementById('matchSound').play();
                
                // 显示激励语
                showEncouragement();
                
                // 创建匹配连线
                createMatchLine();
                
                // 创建烟花特效
                createFireworks();
                
                // 标记为已匹配
                setTimeout(() => {
                    gameState.selectedName.classList.add('matched');
                    gameState.selectedSymbol.classList.add('matched');
                    
                    // 清除选择
                    gameState.selectedName = null;
                    gameState.selectedSymbol = null;
                    
                    // 检查游戏是否完成
                    if (gameState.matchedPairs === gameState.totalPairs) {
                        setTimeout(() => {
                            clearInterval(gameState.timer);
                            showGameOver(true);
                        }, 1000);
                    }
                }, 1000);
            } else {
                // 匹配失败
                const encouragement = document.getElementById('encouragement');
                encouragement.textContent = "不匹配，再试试！";
                encouragement.style.color = "#ff6666";
                encouragement.classList.add('show');
                
                setTimeout(() => {
                    encouragement.classList.remove('show');
                    // 清除选择
                    gameState.selectedName.classList.remove('selected');
                    gameState.selectedSymbol.classList.remove('selected');
                    gameState.selectedName = null;
                    gameState.selectedSymbol = null;
                }, 1000);
            }
        }

        // 创建匹配连线
        function createMatchLine() {
            const nameRect = gameState.selectedName.getBoundingClientRect();
            const symbolRect = gameState.selectedSymbol.getBoundingClientRect();
            const containerRect = document.querySelector('.game-area').getBoundingClientRect();
            
            // 计算连线起点和终点
            const startX = nameRect.right - containerRect.left;
            const startY = nameRect.top + nameRect.height/2 - containerRect.top;
            const endX = symbolRect.left - containerRect.left;
            const endY = symbolRect.top + symbolRect.height/2 - containerRect.top;
            
            // 创建连线元素
            const line = document.createElement('div');
            line.className = 'match-line';
            line.style.left = startX + 'px';
            line.style.top = startY + 'px';
            line.style.width = '0px';
            
            // 计算连线长度和角度
            const length = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
            const angle = Math.atan2(endY - startY, endX - startX) * (180 / Math.PI);
            
            line.style.transform = `rotate(${angle}deg)`;
            line.style.transformOrigin = 'left center';
            
            document.querySelector('.game-area').appendChild(line);
            
            // 连线动画
            gsap.to(line, {
                width: length,
                duration: 0.5,
                ease: "power2.out",
                onComplete: () => {
                    // 连线消失动画
                    setTimeout(() => {
                        gsap.to(line, {
                            opacity: 0,
                            duration: 0.3,
                            onComplete: () => {
                                if (line.parentNode) {
                                    line.parentNode.removeChild(line);
                                }
                            }
                        });
                    }, 500);
                }
            });
        }

        // 显示激励语
        function showEncouragement() {
            const encouragement = document.getElementById('encouragement');
            const randomIndex = Math.floor(Math.random() * encouragements.length);
            encouragement.textContent = encouragements[randomIndex];
            encouragement.style.color = "#ff3399";
            encouragement.classList.add('show');
            
            // 3秒后隐藏
            setTimeout(() => {
                encouragement.classList.remove('show');
            }, 1500);
        }

        // 创建烟花特效
        function createFireworks() {
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 20; i++) {
                const firework = document.createElement('div');
                firework.style.position = 'absolute';
                firework.style.width = '8px';
                firework.style.height = '8px';
                firework.style.borderRadius = '50%';
                firework.style.backgroundColor = getRandomColor();
                firework.style.zIndex = '10';
                
                // 烟花从连线中间位置开始
                firework.style.left = '50%';
                firework.style.top = '50%';
                container.appendChild(firework);
                
                // 随机方向发射
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 200;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;
                
                // 烟花动画
                gsap.to(firework, {
                    x: targetX,
                    y: targetY,
                    opacity: 0,
                    scale: 0,
                    duration: 1 + Math.random() * 0.5,
                    ease: "power2.out",
                    onComplete: () => {
                        container.removeChild(firework);
                    }
                });
            }
        }

        // 获取随机颜色
        function getRandomColor() {
            const colors = ['#ff3399', '#ff66b2', '#ff99cc', '#ffb6d9', '#ff66cc', '#ff33aa'];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        // 更新计时器
        function updateTimer() {
            gameState.timeLeft--;
            document.getElementById('time').textContent = formatTime(gameState.timeLeft);
            
            if (gameState.timeLeft <= 0) {
                clearInterval(gameState.timer);
                showGameOver(false);
            }
            
            // 最后10秒闪烁效果
            if (gameState.timeLeft <= 10) {
                const timerElement = document.getElementById('time');
                timerElement.style.color = '#ff0000';
                
                if (gameState.timeLeft % 2 === 0) {
                    timerElement.style.transform = 'scale(1.1)';
                } else {
                    timerElement.style.transform = 'scale(1)';
                }
            }
        }

        // 格式化时间显示
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 显示游戏结束界面
        function showGameOver(isComplete) {
            document.getElementById('finalScore').textContent = gameState.score;
            
            const gameOverElement = document.getElementById('gameOver');
            const gameOverTitle = gameOverElement.querySelector('h2');
            const gameOverMessage = gameOverElement.querySelector('p');
            
            if (isComplete) {
                gameOverTitle.textContent = "恭喜完成!";
                gameOverMessage.textContent = `你匹配了所有元素! 最终得分: ${gameState.score}`;
            } else {
                gameOverTitle.textContent = "时间到!";
                gameOverMessage.textContent = `你的最终得分: ${gameState.score}`;
            }
            
            // 播放游戏结束音效
            document.getElementById('gameOverSound').currentTime = 0;
            document.getElementById('gameOverSound').play();
            
            setTimeout(() => {
                gameOverElement.classList.add('show');
            }, 500);
        }

        // 重新开始游戏
        function restartGame() {
            initGame();
        }

        // 页面加载完成后初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
